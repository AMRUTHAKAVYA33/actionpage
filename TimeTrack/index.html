<!DOCTYPE html>
<html>
<head>
    <title>TimeTrack - Actions</title>
    <link rel="stylesheet" href="TimeTrack/action.css">
</head>
<body>

    <div class="card">
        <h2>Actions</h2>

        <!-- Live Time -->
        <div class="time-box">
            <h1 id="liveTime"></h1>
            <p id="todayDate"></p> 
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button id="checkBtn">Check In</button>
            <button id="cancelBtn">Cancel</button>
        </div>

        <!-- Total Hours -->
        <div class="info">
            <p><strong>Total Hours</strong></p>
            <p>Effective: <span id="effective">0h 0m</span></p>
            <p>Gross: <span id="gross">0h 0m</span></p>
        </div>

        <!-- Since Login -->
        <div class="info">
            <p><strong>Since Login:</strong> <span id="sinceLogin">0h 0m</span></p>
        </div>

    </div>

<script src="TimeTrack/action.js"></script>
</body>

</html>
